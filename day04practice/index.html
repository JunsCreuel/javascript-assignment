<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript 시연</title>
  </head>
  <body>
    <!-- 1. Event 시연 -->
    <button id="recommend-button">영화 추천 받기</button>
    <p id="recommend-result"></p>

    <hr />

    <!-- 2. Form 시연 -->
    <form id="search-form">
      <input
        type="text"
        id="search-input"
        placeholder="영화 제목을 입력하세요"
      />
      <button type="submit">검색</button>
    </form>

    <!-- JS 파일 연결 -->
    <button class="favorite-button">🤍 찜</button>

    <script src="script.js"></script>
  </body>
</html>
